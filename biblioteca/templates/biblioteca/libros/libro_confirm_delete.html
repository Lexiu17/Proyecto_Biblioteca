{% extends 'biblioteca/base.html' %}

{% block titulo %}Eliminar libro{% endblock %}

{% block contenido %}
<h2>Eliminar libro</h2>
<p>¿Seguro que deseas eliminar «{{ libro.titulo }}»? También se borrarán sus préstamos.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar eliminación</button>
    <a href="{% url 'libro_list' %}">Cancelar</a>
</form>
{% endblock %}
