{% extends 'biblioteca/base.html' %}

{% block titulo %}{% if form.instance.pk %}Editar autor{% else %}Registrar autor{% endif %}{% endblock %}

{% block contenido %}
<h2>{% if form.instance.pk %}Editar autor{% else %}Registrar autor{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p>
        <button type="submit">Guardar autor</button>
        <a href="{% url 'autor_list' %}">Cancelar</a>
    </p>
</form>
{% endblock %}
